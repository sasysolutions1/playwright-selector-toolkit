name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1
      - run: npm ci
      - name: Verify release tag
        run: npm run release:tag -- "${GITHUB_REF_NAME}"
      - name: Run release review
        run: npm run release:check
      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*.tgz
      - name: Attest package SBOM
        uses: actions/attest@v4
        with:
          subject-path: release/*.tgz
          sbom-path: release/sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
      - name: Publish through npm trusted publishing
        run: npm publish --ignore-scripts
